[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greengrid"
version = "1.0.0"
description = "AI-Driven Smart Grid Controller — Predictive Maintenance & Load Balancing for Renewable Energy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "GreenGrid Team"},
]
keywords = ["smart-grid", "renewable-energy", "forecasting", "lstm", "temporal-fusion-transformer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "torch>=2.3,<3.0",
    "pytorch-lightning>=2.3,<3.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
    "streamlit>=1.36,<2.0",
    "plotly>=5.22,<6.0",
    "scipy>=1.13,<2.0",
    "pyyaml>=6.0.1,<7.0",
    "click>=8.1.7,<9.0",
    "loguru>=0.7.2,<1.0",
    "tqdm>=4.66.4,<5.0",
    "requests>=2.31,<3.0",
    "apache-airflow>=2.9,<3.0; python_version < '3.13'",
    "pyarrow>=18.0,<20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
]

[project.scripts]
greengrid = "greengrid.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["greengrid*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
