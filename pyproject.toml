[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greengrid"
version = "1.0.0"
description = "AI-Driven Smart Grid Controller — Predictive Maintenance & Load Balancing for Renewable Energy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "GreenGrid Team"},
]
keywords = ["smart-grid", "renewable-energy", "forecasting", "lstm", "temporal-fusion-transformer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "torch>=2.3,<3.0",
    "pytorch-lightning>=2.3,<3.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
    "streamlit>=1.36,<2.0",
    "plotly>=5.22,<6.0",
    "scipy>=1.13,<2.0",
    "pyyaml>=6.0.1,<7.0",
    "click>=8.1.7,<9.0",
    "loguru>=0.7.2,<1.0",
    "tqdm>=4.66.4,<5.0",
    "requests>=2.31,<3.0",
    "pyarrow>=18.0,<20.0",
]

[project.optional-dependencies]
# Install with: pip install "greengrid[airflow]" (requires Python 3.12, not 3.13)
# Use the dedicated airflow Docker stage which runs python:3.12-slim.
airflow = [
    "apache-airflow>=2.9,<3.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "pre-commit>=3.7,<4.0",
]

[project.scripts]
greengrid = "greengrid.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["greengrid*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v --tb=short --strict-config --strict-markers --cov=greengrid --cov-report=term-missing"

[tool.coverage.run]
source = ["greengrid"]
omit = ["greengrid/dashboard/*"]

[tool.coverage.report]
fail_under = 40

